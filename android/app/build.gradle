apply plugin: 'com.android.application'

android {
    namespace = "mx.citymap.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "mx.citymap.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 38
        versionName "1.38"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    }
}

tasks.register('cleanDuplicateResFiles') {
    doFirst {
        fileTree('src/main/res').matching {
            include '**/* *'
        }.each { file ->
            println "Removing duplicate resource file: ${file.name}"
            file.delete()
        }
    }
}
preBuild.dependsOn 'cleanDuplicateResFiles'
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Resources') }.configureEach {
    dependsOn 'cleanDuplicateResFiles'
}

// Sonido propio de los avisos push (PR #223). El .mp3 es binario y no viaja
// por las herramientas de subida del repo, así que vive como base64 en
// src/main/res/raw/citymap_alert.mp3.b64 y se decodifica aquí, en cada build,
// antes de empaquetar los recursos. Si el .mp3 ya existe y está al día, no
// se toca. Sin el recurso, Android cae al sonido por defecto.
tasks.register('decodeCitymapAlertSound') {
    doLast {
        def b64File = file('src/main/res/raw/citymap_alert.mp3.b64')
        def mp3File = file('src/main/res/raw/citymap_alert.mp3')
        if (!b64File.exists()) {
            logger.warn("citymap_alert.mp3.b64 no encontrado; el sonido propio no se empaquetará")
            return
        }
        if (mp3File.exists() && mp3File.lastModified() >= b64File.lastModified()) return
        mp3File.parentFile.mkdirs()
        mp3File.bytes = java.util.Base64.getMimeDecoder().decode(b64File.text)
        logger.lifecycle("Sonido de notificación decodificado: ${mp3File} (${mp3File.length()} bytes)")
    }
}
preBuild.dependsOn 'decodeCitymapAlertSound'


