<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Analytics se carga de forma diferida vía React (useThirdPartyScripts) para mejorar TTI/LCP -->

    <!-- Fuentes Optimizadas: solo las familias que usa la app (DM Sans es
         el texto y Montserrat el título del hero). DM Serif Display y Plus
         Jakarta Sans venían en la URL pero ningún componente las usa: sus
         archivos nunca se descargaban, solo engordaban el CSS. Coolvetica
         tampoco se usa en la app Vite (su @font-face se quitó de index.css):
         ya no se precarga su OTF de 67 KB en cada visita. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://dpkjxhjkzdlkvyotoeai.supabase.co" crossorigin="anonymous" />
    <link rel="preconnect" href="https://accounts.google.com" crossorigin="anonymous" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@800&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@800&display=swap" /></noscript>
    <!-- Favicon optimizado para Google (múltiplo de 48px) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />

    <!-- Viewport y tema -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <!-- SEO básico — portada global: todas las ciudades -->
    <title>CityMap — Descubre negocios, lugares y eventos de todas las ciudades</title>
    <meta name="description" content="Descubre negocios, lugares, artículos y eventos de todas nuestras ciudades: Guadalajara, Tepic, Puerto Vallarta, Zapopan, Ciudad de México y más. Encuentra dónde comer, qué hacer y qué está pasando con CityMap." />
    <meta name="keywords" content="citymap, que hacer en guadalajara, que hacer en tepic, que hacer en puerto vallarta, que hacer en mi ciudad, donde comer, eventos cerca, mejores restaurantes, experiencias locales, actividades turisticas, vida nocturna, planes fin de semana" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="CityMap" />
    <link rel="canonical" href="https://citymap.mx/" />
    <!-- SEO and Dynamic Meta Handled entirely by React in App.jsx -->

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://citymap.mx/" />
    <meta property="og:title" content="CityMap — Descubre negocios, lugares y eventos de todas las ciudades" />
    <meta property="og:description" content="Descubre negocios, lugares, artículos y eventos de todas nuestras ciudades: Guadalajara, Tepic, Puerto Vallarta, Zapopan, Ciudad de México y más. Encuentra dónde comer, qué hacer y qué está pasando con CityMap." />
    <meta property="og:image" content="https://citymap.mx/og-image.png" />
    <meta property="og:image:width" content="720" />
    <meta property="og:image:height" content="402" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="CityMap" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CityMap — Descubre negocios, lugares y eventos de todas las ciudades" />
    <meta name="twitter:description" content="Descubre negocios, lugares, artículos y eventos de todas nuestras ciudades: Guadalajara, Tepic, Puerto Vallarta, Zapopan, Ciudad de México y más. Encuentra dónde comer, qué hacer y qué está pasando con CityMap." />
    <meta name="twitter:image" content="https://citymap.mx/og-image.png" />

    <!-- Datos estructurados (los ve Google aunque no ejecute JavaScript) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "CityMap",
          "url": "https://citymap.mx/",
          "description": "Descubre negocios, lugares, artículos y eventos de todas nuestras ciudades: Guadalajara, Tepic, Puerto Vallarta, Zapopan, Ciudad de México y más.",
          "inLanguage": "es"
        },
        {
          "@type": "Organization",
          "name": "CityMap",
          "url": "https://citymap.mx/",
          "logo": "https://citymap.mx/citymap.mx.png",
          "description": "Descubre dónde comer, qué hacer y qué está pasando en múltiples ciudades. Explora experiencias locales y organiza tu próximo plan con CityMap."
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Pantalla de arranque: se ve desde el primer pintado, antes de que
         cargue React. Es la misma vista que BrandSplash (fondo negro, logo
         oficial y tres puntos en blanco). React la quita al terminar la
         carga inicial (App.jsx); el temporizador es un respaldo por si el JS
         falla. Los puntos se animan solo con `transform`, que sí funciona
         en Safari/iPhone (el morph de infinito con CSS `d: path()` no). -->
    <div id="boot-splash" style="position:fixed;inset:0;height:100vh;height:100dvh;z-index:9999999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <img src="/logo-brand.png" alt="CityMap" style="width:200px;max-width:60%;object-fit:contain;display:block" />
      <div style="height:24px" aria-hidden="true"></div>
      <div role="status" aria-label="Cargando" style="display:flex;align-items:center;gap:8px">
        <style>
          @keyframes boot-splash-dot {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
          }
          .boot-splash-dot { animation: boot-splash-dot 1.2s ease-in-out infinite; }
          @media (prefers-reduced-motion: reduce) { .boot-splash-dot { animation: none; } }
        </style>
        <span class="boot-splash-dot" style="width:10px;height:10px;border-radius:50%;background:#fff;display:block;animation-delay:0s"></span>
        <span class="boot-splash-dot" style="width:10px;height:10px;border-radius:50%;background:#fff;display:block;animation-delay:0.15s"></span>
        <span class="boot-splash-dot" style="width:10px;height:10px;border-radius:50%;background:#fff;display:block;animation-delay:0.3s"></span>
      </div>
    </div>
    <script>
      // Desde la app nativa el login se abre en un Custom Tab: quitar el
      // splash de arranque para que no se vea como si la app se reiniciara.
      // El fondo queda negro mientras carga el bundle (igual que el splash).
      if (new URLSearchParams(window.location.search).get('from') === 'app') {
        var s = document.getElementById("boot-splash"); if (s) s.remove();
        document.body.style.background = '#000';
      }
      setTimeout(function () { var s = document.getElementById("boot-splash"); if (s) s.remove(); }, 15000);
    </script>
    <main id="root"></main>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
